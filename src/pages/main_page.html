<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Главная панель</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif; margin: 2em; background: #f5f5f5;
    }
    .card {
      background: white; padding: 2em; border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .card-title {
      font-size: 24px; margin-bottom: 1em;
    }
    .stats-grid {
      display: flex; gap: 1em; flex-wrap: wrap;
    }
    .stat-card {
      flex: 1; min-width: 200px;
      background: #fafafa; padding: 1em; border-radius: 8px;
      display: flex; align-items: center;
      box-shadow: 0 0 5px rgba(0,0,0,0.05);
    }
    .stat-icon {
      font-size: 32px; color: white; padding: 0.5em; border-radius: 50%;
      margin-right: 1em;
    }
    .bg-blue { background-color: #2196f3; }
    .bg-orange { background-color: #ff9800; }
    .bg-green { background-color: #4caf50; }
    form { margin-top: 2em; }
    input, textarea {
      width: 100%; padding: 0.5em; margin: 0.5em 0;
      border: 1px solid #ccc; border-radius: 4px;
    }
    button {
      padding: 0.5em 1em; background: #2196f3; color: white;
      border: none; border-radius: 4px; cursor: pointer;
    }
    button:hover { background: #1976d2; }
  </style>
</head>
<body>

<div class="card">
  <h2 class="card-title">Главная панель</h2>
  <button onclick="switch_to_requests()" class="btn">Список заявок</button>
  <button onclick="logout()" class="btn" color="red">Выйти</button>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon bg-blue">
        <i class="material-icons">warning</i>
      </div>
      <div class="stat-info">
        <h3>Новые заявки</h3>
        <p id="new-count">–</p>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon bg-orange">
        <i class="material-icons">build</i>
      </div>
      <div class="stat-info">
        <h3>В работе</h3>
        <p id="in-progress-count">–</p>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon bg-green">
        <i class="material-icons">check_circle</i>
      </div>
      <div class="stat-info">
        <h3>Выполнено</h3>
        <p id="done-count">–</p>
      </div>
    </div>
  </div>

  <hr>

  <h3>Создать новую заявку</h3>
  <form id="create-request-form">
    <label>Номер квартиры:</label>
    <input type="number" id="apartment_id" required>

    <label>ID жильца:</label>
    <input type="number" id="resident_id" required>

    <label>Тип заявки:</label>
    <input type="text" id="type" required>

    <label>Описание:</label>
    <textarea id="description" rows="4" required></textarea>

    <button type="submit">Создать заявку</button>
    <p id="create-status"></p>
  </form>
</div>

<script>
  const API_URL = 'http://localhost:8000';
  const token = localStorage.getItem("auth_token");
  if (!token) {
    window.location.href = "login.html";
  }
  console.log(token);

  function switch_to_requests() {
    localStorage.setItem("auth_token", token);
    window.location.href = "requests.html";
  }

  async function loadRequestStats() {
    const res = await fetch(API_URL + "/api/requests", {
      method: "POST",
      headers: { "Authorization": "Bearer " + token }
    });
    if (!res.ok) return;

    const data = await res.json();
    const counts = { new: 0, in_progress: 0, done: 0 };
    data.requests.forEach(r => {
      const status = r.status.toLowerCase();
      if (status.includes("нов") || status === "new") counts.new++;
      else if (status.includes("работ") || status === "in progress") counts.in_progress++;
      else if (status.includes("выполн") || status === "done") counts.done++;
    });

    document.getElementById("new-count").textContent = counts.new;
    document.getElementById("in-progress-count").textContent = counts.in_progress;
    document.getElementById("done-count").textContent = counts.done;
  }

  document.getElementById('create-request-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = {
      apartment_id: parseInt(document.getElementById("apartment_id").value),
      resident_id: parseInt(document.getElementById("resident_id").value),
      type: document.getElementById("type").value,
      description: document.getElementById("description").value
    };
const res = await fetch(API_URL + '/api/requests/create', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify(body)
    });

    const data = await res.json();
    if (res.ok && data.success) {
      document.getElementById('create-status').textContent = 'Заявка создана';
      loadRequestStats();
    } else {
      document.getElementById('create-status').textContent = 'Ошибка создания заявки';
    }
  });

  function logout() {
    //localStorage.removeItem("token");
    window.location.href = "login.html";
  }

  loadRequestStats();
</script>

</body>
</html>
