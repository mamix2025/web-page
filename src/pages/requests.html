<!DOCTYPE html>
<html lang="ru">
<head>

  <meta charset="UTF-8" />
  <title>Заявки</title>
   <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ddd;
    }
    select {
      padding: 5px;
    }
    button {
      padding: 5px 10px;
      margin-top: 5px;
    }
    .logout {
      float: right;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <button class="logout" onclick="logout()">Выход</button>
  <button onclick="switch_to_main()" class="btn">Список заявок</button>
  <h1>Список заявок</h1>
  <table id="requests-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Адрес</th>
        <th>Квартира</th>
        <th>Тип</th>
        <th>Статус</th>
        <th>Дата</th>
        <th>Жилец</th>
        <th>Действия</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="../js/requests.js"></script>
</body>
</html>
