<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Авторизация</title>
  <style>
    body {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; background: #f0f0f0; font-family: Arial, sans-serif;
    }
    .auth-card {
      background: white; padding: 2em; border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 350px;
    }
    h2 { text-align: center; }
    input, textarea {
      width: 100%; padding: 0.5em; margin: 0.4em 0; border: 1px solid #ccc; border-radius: 4px;
    }
    button {
      width: 100%; padding: 0.5em; background: #1976d2; color: white;
      border: none; border-radius: 4px; margin-top: 0.5em;
      cursor: pointer;
    }
    button:hover { background: #1565c0; }
    .toggle-link {
      text-align: center; font-size: 0.9em; margin-top: 1em; cursor: pointer; color: #007bff;
    }
    .error { color: red; font-size: 0.9em; text-align: center; margin-top: 0.5em; }
  </style>
</head>
<body>

<div class="auth-card">
  <h2 id="form-title">Вход</h2>

  <div id="register-fields" style="display:none">
    <input type="text" id="full_name" placeholder="ФИО">
    <input type="text" id="phone" placeholder="Телефон">
    <input type="email" id="email" placeholder="Email">
  </div>

  <input type="text" id="login" placeholder="Логин">
  <input type="password" id="password" placeholder="Пароль">

  <button id="submit-btn" onclick="submitForm()">Войти</button>

  <div class="toggle-link" onclick="toggleMode()">
    Нет аккаунта? Зарегистрироваться
  </div>

  <p class="error" id="error"></p>
</div>

<script>
  const API_URL = 'http://localhost:8000';
  let isLogin = true;

  function toggleMode() {
    isLogin = !isLogin;
    document.getElementById("form-title").innerText = isLogin ? "Вход" : "Регистрация";
    document.getElementById("submit-btn").innerText = isLogin ? "Войти" : "Зарегистрироваться";
    document.getElementById("register-fields").style.display = isLogin ? "none" : "block";
    document.querySelector(".toggle-link").innerText = isLogin ? "Нет аккаунта? Зарегистрироваться" : "Уже есть аккаунт? Войти";
    document.getElementById("error").innerText = "";
  }

  async function submitForm() {
    const login = document.getElementById('login').value;
    const password = document.getElementById('password').value;
    const errorBox = document.getElementById("error");

    let url = isLogin ? API_URL + '/api/login' : API_URL + '/api/register';
    let body = isLogin
      ? { login, password }
      : {
          login, password,
          full_name: document.getElementById('full_name').value,
          phone: document.getElementById('phone').value,
          email: document.getElementById('email').value
        };

    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    const data = await res.json();
    if (res.ok && data.success) {
      if (isLogin) {
        localStorage.setItem("auth_token", data.token);
        window.location.href = "main_page.html";
      } else {
        errorBox.style.color = "green";
        errorBox.innerText = "Регистрация прошла успешно. Теперь войдите.";
        toggleMode();
      }
    } else {
      errorBox.style.color = "red";
      errorBox.innerText = data.message || "Ошибка";
    }
  }
</script>

</body>
</html>
